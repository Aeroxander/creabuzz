# Creaton on the single-node bundle (see README.md, "Creaton"). Added by run.sh when BUZZ_COMPOSE_CREATON=true.
#
# The relay image is built from this checkout with the new Creaton app (app/) inside it, and the app's network settings
# from .env (VITE_CREATON_*: they are read when the app is built, and are public in the page). Every one is empty unless
# .env sets it, and with none of them the app shows no money screens: the money screens need the build's network AND the
# server's own switch, BUZZ_INVESTING, which is off unless .env says true. The upstream image would serve Buzz, without the
# Creaton app or its database migrations. The server also turns on what the app relies on: unread markers, the app's own page routes,
# and the terms and privacy note shown at sign-up (run.sh reads them from their files), and the age box.
services:
  relay:
    image: ${CREATON_IMAGE:-creaton-relay:local}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: runtime-creaton
      args:
        BUZZ_SOURCE_SHA: ${BUZZ_SOURCE_SHA:-unknown}
        # The new app's settings (docs/next-version/DEPLOY-TEST-NETWORK.md). The first three are the values of
        # contracts/pot/deployments/pot-<chain>.json; run.sh fills them from CREATON_DEPLOYMENTS_FILE when .env names it.
        VITE_CREATON_CHAIN_ID: ${VITE_CREATON_CHAIN_ID:-}
        VITE_CREATON_LAUNCHER: ${VITE_CREATON_LAUNCHER:-}
        VITE_CREATON_DOLLAR: ${VITE_CREATON_DOLLAR:-}
        VITE_CREATON_RPC_URL: ${VITE_CREATON_RPC_URL:-}
        VITE_CREATON_PASSKEY_ACCOUNT: ${VITE_CREATON_PASSKEY_ACCOUNT:-}
        VITE_CREATON_BUNDLER_URL: ${VITE_CREATON_BUNDLER_URL:-}
        VITE_CREATON_SPONSOR_URL: ${VITE_CREATON_SPONSOR_URL:-}
        VITE_CREATON_EARLIER_CONTRACT: ${VITE_CREATON_EARLIER_CONTRACT:-}
        VITE_CREATON_EARLIER_TEXT_HASH: ${VITE_CREATON_EARLIER_TEXT_HASH:-}
        VITE_CREATON_EARLIER_TEXT_URL: ${VITE_CREATON_EARLIER_TEXT_URL:-}
    environment:
      # Unread rooms and boards: the server's private read-state API (D101).
      BUZZ_V1_ENABLED: ${BUZZ_V1_ENABLED:-true}
      # How much one signed-in person may send. The first counts every read, live update and write the web app sends,
      # per second, averaged over 5 seconds and shared by all of that person's tabs and devices; the second counts
      # writes a minute. The relay's own default (10 a second) is sized for chat clients: the web app opens several
      # reads per page, and one person may have two tabs open. Measured on 2026-10-29: the social suite's busiest five
      # seconds for one person was 81 requests (the relay's default allows 50); 40 a second allows 200, room for two busy
      # tabs.
      # The web app's HTTP reads (/query, unread state) count against a third limit, BUZZ_RATE_LIMIT_HUMAN_API_CALLS_PER_MIN
      # (relay default 300 a minute), which is left at its default.
      BUZZ_RATE_LIMIT_HUMAN_WS_EVENTS_PER_SEC: ${BUZZ_RATE_LIMIT_HUMAN_WS_EVENTS_PER_SEC:-40}
      BUZZ_RATE_LIMIT_HUMAN_MESSAGES_PER_MIN: ${BUZZ_RATE_LIMIT_HUMAN_MESSAGES_PER_MIN:-300}
      # Every path the server does not own opens the web app (its own routes, and invites on every community address).
      BUZZ_WEB_SPA: full
      # Shown at sign-up. run.sh fills these from BUZZ_TERMS_FILE and BUZZ_PRIVACY_FILE, and refuses a file that still
      # has a draft's [placeholders]. Empty shows none.
      BUZZ_TERMS_OF_SERVICE_MARKDOWN: ${BUZZ_TERMS_OF_SERVICE_MARKDOWN:-}
      BUZZ_PRIVACY_POLICY_MARKDOWN: ${BUZZ_PRIVACY_POLICY_MARKDOWN:-}
      # The "I am 18 years of age or older" box at sign-up. On unless .env says false, so an older .env gets it too.
      BUZZ_AGE_ATTESTATION_REQUIRED: ${BUZZ_AGE_ATTESTATION_REQUIRED:-true}
