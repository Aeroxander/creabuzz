# Creaton on the single-node bundle (see README.md, "Creaton"). Added by run.sh when BUZZ_COMPOSE_CREATON=true.
#
# The relay image is built from this checkout, with the Creaton web app inside it and the app's network settings
# from .env (they are read when the app is built, and are public in the page). The upstream image would serve Buzz,
# without the Creaton app or its database migrations. The server also turns on what the app relies on: unread markers,
# the app's own page routes, and the terms and privacy note shown at sign-up (run.sh reads them from their files).
services:
  relay:
    image: ${CREATON_IMAGE:-creaton-relay:local}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: runtime
      args:
        BUZZ_SOURCE_SHA: ${BUZZ_SOURCE_SHA:-unknown}
        VITE_LAUNCHPAD_CHAIN_ID: ${VITE_LAUNCHPAD_CHAIN_ID:-}
        VITE_CHAIN_RPC_URL: ${VITE_CHAIN_RPC_URL:-}
        VITE_CONTRIBUTOR_KITS: ${VITE_CONTRIBUTOR_KITS:-}
        VITE_HISTORY_FROM_BLOCKS: ${VITE_HISTORY_FROM_BLOCKS:-}
        VITE_ZERODEV_PROJECT_ID: ${VITE_ZERODEV_PROJECT_ID:-}
        VITE_ZERODEV_CHAIN_ID: ${VITE_ZERODEV_CHAIN_ID:-}
        VITE_ZERODEV_API_KEY: ${VITE_ZERODEV_API_KEY:-}
        VITE_BUNDLER_URL: ${VITE_BUNDLER_URL:-}
        VITE_ERROR_REPORT_URL: ${VITE_ERROR_REPORT_URL:-}
        VITE_APP_RELEASE: ${VITE_APP_RELEASE:-}
        VITE_COMMUNITY_API_ORIGIN: ${VITE_COMMUNITY_API_ORIGIN:-}
    environment:
      # Unread rooms and boards: the server's private read-state API (D101).
      BUZZ_V1_ENABLED: ${BUZZ_V1_ENABLED:-true}
      # Every path the server does not own opens the web app (its own routes, and invites on every community address).
      BUZZ_WEB_SPA: full
      # Shown at sign-up. run.sh fills these from BUZZ_TERMS_FILE and BUZZ_PRIVACY_FILE, and refuses a file that still
      # has a draft's [placeholders]. Empty shows none.
      BUZZ_TERMS_OF_SERVICE_MARKDOWN: ${BUZZ_TERMS_OF_SERVICE_MARKDOWN:-}
      BUZZ_PRIVACY_POLICY_MARKDOWN: ${BUZZ_PRIVACY_POLICY_MARKDOWN:-}
