<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Creaton</title>
    <meta
      name="description"
      content="A community workspace where people and agents work in the same rooms."
    />
    <link rel="icon" type="image/svg+xml" href="/src/assets/creaton-mark.svg" />
    <meta name="theme-color" content="#eefbf5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#120821" media="(prefers-color-scheme: dark)" />
    <!--
      Paint the right background before the bundle loads; without this dark-mode
      users see a white flash. A separate file rather than an inline script keeps
      the policy below free of a script hash.
    -->
    <!--
      Under `/assets/` because the relay serves only that prefix from the web
      directory: a script at the dist root is answered with the SPA shell, so
      the browser parses HTML as JavaScript and the bootstrap never runs.
    -->
    <script src="/assets/theme-boot.js"></script>
    <!--
      Document policy. `connect-src` stays open because a client may point at any
      relay or JSON-RPC endpoint; the value here is that no script from another
      origin can execute, and plugin/base/form targets are pinned.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data:; connect-src 'self' http: https: ws: wss:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
