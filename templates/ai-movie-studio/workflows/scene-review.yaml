name: scene-review
description: Send each new scene brief to the producer for approval, then post the approved scene prompt in-thread
trigger:
  on: message_posted
  filter: '!trigger_is_reply'
steps:
  - id: request
    name: Producer review
    action: request_approval
    from: "@The Producer"
    message: "Scene brief for review: {{trigger.text | truncate(200)}}"
    timeout: 24h
  - id: publish
    name: Publish approved scene prompt
    if: 'steps_request_output_approved == true'
    action: send_message
    reply_in_thread: true
    text: |
      🎬 Scene prompt — approved by the producer

      {{trigger.text}}

      Paste it into your image or video tool (ComfyUI, Midjourney, MiniMax, or whatever your studio renders with). For a variant, reply in this thread and ask @The Scene Generator — change one dimension at a time: lens, light, or mood.
enabled: true
