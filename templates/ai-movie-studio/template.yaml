id: ai-movie-studio
name: "AI Movie Studio"
description: "A writers' room with a staff of three: The Writer breaks your story, The Producer keeps the schedule honest, and The Scene Generator turns scene briefs into ready-to-paste AI prompts. Mention an agent to wake it, approve in the queue, and wake up to a standup that writes itself."
channels:
  - id: writers-room
    name: writers-room
    purpose: "The writing table. Kick around premises, beats, and dialogue — mention @The Writer and the story gets better."
    seed: seeds/writers-room.md
  - id: production
    name: production
    purpose: "The producer's board: schedules, status, decisions. Ask @The Producer for a breakdown or a straight answer on where things stand."
    seed: seeds/production.md
  - id: scene-gen
    name: scene-gen
    purpose: "Post a scene brief, get an approved, ready-to-paste AI image or video prompt. Briefs go to the producer's approval queue."
    seed: seeds/scene-gen.md
  - id: standup
    name: standup
    purpose: "The daily standup home. Every weekday morning the studio writes its standup page in the wiki — talk about it here."
    seed: seeds/standup.md
personas:
  - id: writer
    name: "The Writer"
    prompt: personas/writer.md
  - id: producer
    name: "The Producer"
    prompt: personas/producer.md
  - id: scene-gen
    name: "The Scene Generator"
    prompt: personas/scene-gen.md
workflows:
  - file: workflows/nightly-standup.yaml
  - file: workflows/scene-review.yaml
docs:
  - file: docs/story-bible.md
    title: "Story Bible"
  - file: docs/production-guide.md
    title: "Production Guide"
welcome: welcome.md
