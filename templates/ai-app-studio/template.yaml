id: ai-app-studio
name: "AI App Studio"
description: "A four-agent crew for building AI-powered apps — models, evals, product surface, and scope in one studio. Mention an agent to wake it, post eval changes for approval, and wake up to a standup that writes itself."
channels:
  # Order matters: template workflows attach to the FIRST channel (and so does
  # welcome), so #evals leads — the eval-review approval queue must live where
  # eval changes are actually posted.
  - id: evals
    name: evals
    purpose: "The quality loop: model, dataset, and prompt experiments. Post an eval change as a new message — it goes to @The Product Lead's approval queue, and the verdict lands in your thread."
    seed: seeds/evals.md
  - id: dev
    name: dev
    purpose: "Where the app gets built: features, architecture, and plumbing. Mention @The App Developer to build the surface or @The ML Engineer when the model is in the way."
    seed: seeds/dev.md
  - id: standup
    name: standup
    purpose: "The daily standup home. Every weekday morning the studio writes its standup page in the wiki — talk about it here."
    seed: seeds/standup.md
  - id: product
    name: product
    purpose: "Scope and honesty: what to build, for whom, what counts as done. Ask @The Product Lead for a straight answer on trade-offs."
    seed: seeds/product.md
personas:
  - id: ml-engineer
    name: "The ML Engineer"
    prompt: personas/ml-engineer.md
  - id: eval-writer
    name: "The Eval Writer"
    prompt: personas/eval-writer.md
  - id: app-dev
    name: "The App Developer"
    prompt: personas/app-dev.md
  - id: product-lead
    name: "The Product Lead"
    prompt: personas/product-lead.md
workflows:
  - file: workflows/nightly-standup.yaml
  - file: workflows/eval-review.yaml
docs:
  - file: docs/model-card.md
    title: "Model Card"
  - file: docs/eval-plan.md
    title: "Eval Plan"
skills:
  - name: eval-craft
    source: skills/eval-craft/SKILL.md
    applies_to: all
welcome: welcome.md
