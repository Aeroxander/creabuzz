[profile.default]
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
# vm.ffi for the pinned P-256 fixture signer in test/kernel-sign.mjs
# (KernelWebAuthnUserOp.t.sol).
ffi = true
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[rpc_endpoints]
anvil = "http://127.0.0.1:8545"
sepolia = "${SEPOLIA_RPC_URL}"
