# Milestones 1 and 2 of docs/NEXT-VERSION-PLAN.md: a separate Foundry project, so the existing contracts build in
# ../foundry.toml (and the bytecode pinned in the desktop app) is untouched. Milestone 1 files (and everything vendored)
# compile with the solc the vendored Uniswap code is pinned to (=0.8.26). Milestone 2 files (ShareToken, Vester,
# Treasury, Launcher, RollingCap) are first-party and use the repo's production pin (=0.8.37) with the optimizer at 200
# runs, like ../foundry.toml; see the restriction at the bottom of the list below.
[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
libs = ["lib"]
auto_detect_remappings = false
auto_detect_solc = true
evm_version = "cancun"
optimizer = true
optimizer_runs = 11111
via_ir = true
bytecode_hash = "none"
# `forge test` compiles only what the tests import. The Deployer and Permit2 artifacts are loaded by path, so run
# `forge build` first (the Deployer is also imported by test/helpers/Stack.sol so it is rebuilt when it changes).
ignored_error_codes = [2424]
fs_permissions = [{ access = "read", path = "./out" }]

# Our own files say `pragma solidity 0.8.26` exactly. The vendored code is held to 0.8.26 here (the upstream pin) except
# Permit2, which is pinned to exactly 0.8.17 upstream (its helper file is test/helpers/Permit2Build.sol). The bids
# of the auction go through Permit2 at its fixed address, so the local test twin needs the real code.
compilation_restrictions = [
  { paths = "lib/continuous-clearing-auction/src/**", version = "=0.8.26" },
  { paths = "lib/continuous-clearing-auction/lib/liquidity-launcher/src/**", version = "=0.8.26" },
  { paths = "lib/continuous-clearing-auction/lib/liquidity-launcher/lib/v4-core/src/**", version = "=0.8.26" },
  { paths = "lib/continuous-clearing-auction/lib/liquidity-launcher/lib/v4-periphery/src/**", version = "=0.8.26" },
  { paths = "lib/continuous-clearing-auction/lib/permit2/src/{Permit2,AllowanceTransfer,SignatureTransfer,EIP712}.sol", version = "=0.8.17" },
  { paths = "lib/continuous-clearing-auction/lib/solady/**", version = "=0.8.26" },
  { paths = "lib/continuous-clearing-auction/lib/openzeppelin-contracts/**", version = "=0.8.26" },
  { paths = "lib/continuous-clearing-auction/lib/blocknumberish/**", version = "=0.8.26" },
  # First-party milestone 2 code: the repo's production compiler and optimizer setting. The OpenZeppelin copy used
  # here is the repo's own (lib/openzeppelin-contracts, not the older one nested under the auction).
  { paths = "src/{ShareToken,Vester,Treasury,Launcher,RollingCap,Finisher,LiquidityHolder,Interfaces}.sol", version = "=0.8.37", optimizer_runs = 200 },
  { paths = "lib/openzeppelin-contracts/**", version = "=0.8.37", optimizer_runs = 200 },
  # The milestone 3 test files and their base, built like the code they test: with the optimizer at 200 runs the large via-IR test
  # functions compile where the 11,111-run setting runs out of stack in one of them.
  { paths = "test/{Life,LifeFuzz,LifeInvariants,FinishAttacks,FinisherPool,SaleRules,MarketAttacks,LiquidityHolder,GasM3,TreasuryAbandon}.t.sol", version = "=0.8.37", optimizer_runs = 200 },
  { paths = "test/helpers/{Platform,LifeHandler}.sol", version = "=0.8.37", optimizer_runs = 200 },
]
additional_compiler_profiles = [{ name = "own", optimizer_runs = 200 }]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 200
fail_on_revert = false
show_metrics = false

[fmt]
line_length = 120
tab_width = 4
quote_style = "double"
number_underscore = "thousands"

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
