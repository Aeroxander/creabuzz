[package]
name = "buzz-evm-auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "EVM identity for Buzz: SIWE (EIP-4361) login and EIP-712 signer attestations"

[dependencies]
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }
chrono     = { workspace = true }
hex        = { workspace = true }
k256       = { workspace = true }
sha3       = { workspace = true }

[features]
default = []
# RPC-backed smart-account verification (EIP-1271/6492). Adds transport + async deps.
rpc = ["dep:reqwest", "dep:tokio", "dep:async-trait"]

[dependencies.reqwest]
workspace = true
optional = true

[dependencies.async-trait]
version = "0.1"
optional = true

[dependencies.tokio]
workspace = true
optional = true

[dev-dependencies]
# Driving the async verifier tests when `rpc` is enabled.
tokio = { workspace = true, features = ["rt", "macros", "time"] }
