name: CI / Contracts
on:
  workflow_call:
    outputs:
      contracts_result:
        value: ${{ jobs.results.outputs.contracts_result }}

# contracts/pot is the only Foundry project: the money contracts the app talks to. `forge test` runs the unit, fuzz
# (1,000 runs) and invariant (256 runs of 200 steps) suites, which includes the contract-size test that binds the size
# limits. contracts/pot/lib is a link to contracts/lib (forge-std and OpenZeppelin 5), so the submodules are checked out.
env:
  # The contracts are not linted on build: their warnings are not the gate.
  FOUNDRY_LINT_LINT_ON_BUILD: "false"

jobs:
  forge:
    name: Forge
    runs-on: ubuntu-latest
    # Minutes on a laptop, longer cold.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - name: Install Foundry
        run: |
          curl -sSfL https://github.com/foundry-rs/foundry/releases/download/stable/foundry_stable_linux_amd64.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Install the pinned solc
        # contracts/pot/foundry.toml pins solc 0.8.37, which some forge releases do not know: install it (SHA-256
        # checked) where forge looks, and do nothing when it is already there.
        run: scripts/ensure-solc.sh 0.8.37
      - name: forge build
        working-directory: contracts/pot
        run: forge build
      - name: forge test
        working-directory: contracts/pot
        run: forge test

  results:
    name: Results
    if: ${{ always() }}
    needs: [forge]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      contracts_result: ${{ needs.forge.result }}
    steps:
      - run: echo "Captured contracts job results"
