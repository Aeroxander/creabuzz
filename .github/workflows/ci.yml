name: CI
on:
  push:
    branches: [main, release]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  BUZZ_TEST_POSTGRES_PASSWORD: buzz_dev

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    # The steps take about 90 seconds, and GitHub can finish the job minutes after
    # the last step; a 2-minute limit cancels finished runs (upstream uses 10).
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Every suite goes through the conservative PR-file-list-limit selection
      # (scripts/ci-runtime-selection.mjs).
      rust: ${{ steps.selection.outputs.rust }}
      app: ${{ steps.selection.outputs.app }}
      pot: ${{ steps.selection.outputs.pot }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 2
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # PR files come from GitHub's PR diff. A tokenless comparison uses the
          # checked-out merge commit and can include newer, unrelated base changes.
          token: ${{ github.token }}
          # Root and docs/ Markdown do not select runtime suites. Markdown under
          # runtime directories remains covered by the directory filters below.
          filters: |
            rust:
              - 'crates/**'
              - 'migrations/**'
              - 'schema/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.config/nextest.toml'
              - 'scripts/postgres-test-*.sh'
              - 'scripts/reconcile-schema-after-pgschema.sql'
              - 'bin/pgschema'
              - 'bin/.pgschema-*.pkg'
              - 'scripts/check-postgres-test-discovery.py'
              - 'scripts/test-postgres-test-discovery.sh'
              - 'scripts/test-postgres-test-wrapper.sh'
              - 'deny.toml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/_ci-*.yml'
              - 'docker-compose.yml'
              - 'docker-compose.ci.yml'
              - 'scripts/run-tests.sh'
              - 'Justfile'
            app:
              - 'app/**'
              - 'packages/**'
              - 'patches/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'knip.jsonc'
              - 'scripts/check-file-sizes-core.mjs'
              - 'scripts/check-copy-core.mjs'
              - 'Dockerfile'
              - 'deploy/**'
              - 'Justfile'
              - '.github/workflows/ci.yml'
              - '.github/workflows/_ci-app.yml'
            pot:
              - 'contracts/pot/**'
              - 'contracts/lib/**'
              - '.gitmodules'
              - 'scripts/ensure-solc.sh'
              - 'scripts/pot-*.sh'
              - 'scripts/chain-loop-pot-check.py'
              - 'scripts/pot-app-abi.mjs'
              - 'Justfile'
              - '.github/workflows/ci.yml'
              - '.github/workflows/_ci-app.yml'
              - '.github/workflows/_ci-contracts.yml'
      - name: Select suites conservatively at the PR file-list limit
        id: selection
        env:
          FILTER_OUTPUTS: ${{ toJSON(steps.filter.outputs) }}
        run: node scripts/ci-runtime-selection.mjs
      - name: Validate PostgreSQL test discovery
        if: github.event_name == 'push' || steps.selection.outputs.rust == 'true'
        run: |
          scripts/test-postgres-test-discovery.sh
          scripts/test-postgres-test-wrapper.sh
      - name: Release workflow source contract
        run: scripts/test-release-ref-contract.sh
      - name: Relay image eligibility contract
        run: scripts/test-relay-image-eligibility-workflow.sh
      - name: Codex security review contract
        run: just security-review-check
      - name: Rust cache contract
        run: |
          scripts/test-rust-cache-contract.sh
          scripts/test-rust-cache-contract-regressions.sh
      - name: CI path selection regression tests
        run: node --test scripts/ci-selection.test.mjs scripts/ci-required-gates.test.mjs scripts/ci-apt-retry.test.mjs
      - name: File size policy
        run: just file-size-check

  dead-token-guard:
    name: Dead Token Reference Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Check for dead API token references in client code
        run: |
          # Fail if dead API token patterns reappear in the app, the shared package, or config.
          # Relay crates are excluded — they still use token auth internally.
          PATTERNS='TokenScope|MintTokenResponse|hasApiToken|spr_tok_'
          PATHS='app/src/ app/tests/ packages/creaton-core/src/ .env.example'
          EXCLUDES='--exclude-dir=node_modules'
          if grep -rn $EXCLUDES -E "$PATTERNS" $PATHS 2>/dev/null; then
            echo "::error::Dead API token references found in client code. See above."
            exit 1
          fi
          echo "No dead token references found."

  rust:
    name: Rust
    needs: [changes]
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
    uses: ./.github/workflows/_ci-rust.yml
    with:
      rust: ${{ needs.changes.outputs.rust == 'true' }}
      lane: required

  rust-cross-compile-domain:
    name: Rust Cross-Compile
    needs: [changes]
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
    uses: ./.github/workflows/_ci-rust.yml
    with:
      rust: ${{ needs.changes.outputs.rust == 'true' }}
      lane: cross-compile

  relay-artifacts-domain:
    name: Relay Artifact Producer
    needs: [changes]
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
    uses: ./.github/workflows/_ci-relay.yml
    with:
      rust: ${{ needs.changes.outputs.rust == 'true' }}
      lane: artifacts

  postgres-domain:
    name: PostgreSQL Domain
    needs: [changes, relay-artifacts-domain]
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
    uses: ./.github/workflows/_ci-relay.yml
    with:
      rust: ${{ needs.changes.outputs.rust == 'true' }}
      lane: postgres

  relay-domain:
    name: Relay and PostgreSQL
    needs: [changes, relay-artifacts-domain]
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
    uses: ./.github/workflows/_ci-relay.yml
    with:
      rust: ${{ needs.changes.outputs.rust == 'true' }}
      lane: required

  app-domain:
    name: App Domain
    needs: [changes]
    if: github.event_name == 'push' || needs.changes.outputs.app == 'true' || needs.changes.outputs.pot == 'true'
    uses: ./.github/workflows/_ci-app.yml
    with:
      app: ${{ needs.changes.outputs.app == 'true' }}
      pot: ${{ needs.changes.outputs.pot == 'true' }}

  contracts-domain:
    name: Contracts Domain
    needs: [changes]
    if: github.event_name == 'push' || needs.changes.outputs.pot == 'true'
    uses: ./.github/workflows/_ci-contracts.yml

  security-domain:
    name: Security Domain
    needs: [changes]
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
    uses: ./.github/workflows/_ci-security.yml
    with:
      rust: ${{ needs.changes.outputs.rust == 'true' }}

  rust-lint:
    name: Rust Lint
    if: always() && (needs.changes.result != 'success' || (github.event_name == 'push' || needs.changes.outputs.rust == 'true'))
    needs: [changes, rust]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check Rust Lint result
        env:
          SELECTION_RESULT: ${{ needs.changes.result }}
          RESULT: ${{ needs.rust.outputs.rust_lint_result }}
        run: test "$SELECTION_RESULT" = success && test "$RESULT" = success

  unit-tests:
    name: Unit Tests
    if: always() && (needs.changes.result != 'success' || (github.event_name == 'push' || needs.changes.outputs.rust == 'true'))
    needs: [changes, rust]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check Unit Tests result
        env:
          SELECTION_RESULT: ${{ needs.changes.result }}
          RESULT: ${{ needs.rust.outputs.unit_tests_result }}
        run: test "$SELECTION_RESULT" = success && test "$RESULT" = success

  windows-rust:
    name: Windows Rust (x86_64-pc-windows-msvc)
    if: always() && (needs.changes.result != 'success' || (github.event_name == 'push' || needs.changes.outputs.rust == 'true'))
    needs: [changes, rust]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check Windows Rust (x86_64-pc-windows-msvc) result
        env:
          SELECTION_RESULT: ${{ needs.changes.result }}
          RESULT: ${{ needs.rust.outputs.windows_rust_result }}
        run: test "$SELECTION_RESULT" = success && test "$RESULT" = success

  relay-artifacts:
    name: Relay Artifacts
    if: always() && (needs.changes.result != 'success' || (github.event_name == 'push' || needs.changes.outputs.rust == 'true'))
    needs: [changes, relay-artifacts-domain]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check Relay Artifacts result
        env:
          SELECTION_RESULT: ${{ needs.changes.result }}
          RESULT: ${{ needs.relay-artifacts-domain.outputs.relay_artifacts_result }}
        run: test "$SELECTION_RESULT" = success && test "$RESULT" = success

  backend-integration:
    name: Backend Integration (relay e2e)
    if: always() && (needs.changes.result != 'success' || (needs.relay-artifacts-domain.result == 'success' && (github.event_name == 'push' || needs.changes.outputs.rust == 'true')))
    needs: [changes, relay-artifacts-domain, relay-domain]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check Backend Integration (relay e2e) result
        env:
          SELECTION_RESULT: ${{ needs.changes.result }}
          RESULT: ${{ needs.relay-domain.outputs.backend_integration_result }}
        run: test "$SELECTION_RESULT" = success && test "$RESULT" = success

  postgres-tests:
    name: PostgreSQL Tests
    if: always() && (needs.changes.result != 'success' || (needs.relay-artifacts-domain.result == 'success' && (github.event_name == 'push' || needs.changes.outputs.rust == 'true')))
    needs: [changes, relay-artifacts-domain, postgres-domain]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check PostgreSQL Tests result
        env:
          SELECTION_RESULT: ${{ needs.changes.result }}
          RESULT: ${{ needs.postgres-domain.outputs.postgres_tests_result }}
        run: test "$SELECTION_RESULT" = success && test "$RESULT" = success

  relay-e2e:
    name: Relay E2E
    if: always() && (needs.changes.result != 'success' || (needs.relay-artifacts-domain.result == 'success' && (github.event_name == 'push' || needs.changes.outputs.rust == 'true')))
    needs: [changes, relay-artifacts-domain, relay-domain]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check Relay E2E result
        env:
          SELECTION_RESULT: ${{ needs.changes.result }}
          RESULT: ${{ needs.relay-domain.outputs.relay_e2e_result }}
        run: test "$SELECTION_RESULT" = success && test "$RESULT" = success

  app:
    name: App
    if: always() && (needs.changes.result != 'success' || (github.event_name == 'push' || needs.changes.outputs.app == 'true'))
    needs: [changes, app-domain]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check App result
        env:
          SELECTION_RESULT: ${{ needs.changes.result }}
          RESULT: ${{ needs.app-domain.outputs.app_result }}
        run: test "$SELECTION_RESULT" = success && test "$RESULT" = success

  pot:
    name: Pot Contracts
    if: always() && (needs.changes.result != 'success' || (github.event_name == 'push' || needs.changes.outputs.pot == 'true'))
    needs: [changes, contracts-domain]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check Pot Contracts result
        env:
          SELECTION_RESULT: ${{ needs.changes.result }}
          RESULT: ${{ needs.contracts-domain.outputs.contracts_result }}
        run: test "$SELECTION_RESULT" = success && test "$RESULT" = success

  pot-loops:
    name: Pot Loops
    if: always() && (needs.changes.result != 'success' || (github.event_name == 'push' || needs.changes.outputs.app == 'true' || needs.changes.outputs.pot == 'true'))
    needs: [changes, app-domain]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check Pot Loops result
        env:
          SELECTION_RESULT: ${{ needs.changes.result }}
          RESULT: ${{ needs.app-domain.outputs.pot_loops_result }}
        run: test "$SELECTION_RESULT" = success && test "$RESULT" = success

  security:
    name: Security
    if: always() && (needs.changes.result != 'success' || (github.event_name == 'push' || needs.changes.outputs.rust == 'true'))
    needs: [changes, security-domain]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check Security result
        env:
          SELECTION_RESULT: ${{ needs.changes.result }}
          RESULT: ${{ needs.security-domain.outputs.security_result }}
        run: test "$SELECTION_RESULT" = success && test "$RESULT" = success
